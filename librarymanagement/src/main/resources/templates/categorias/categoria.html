<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioTech — Cadastro de Categoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/crud-additions.css}">
</head>
<body>
<nav class="navbar">
  <div class="nav-container">
    <a th:href="@{/livros}" class="brand"><span class="brand-icon">📚</span><span>Biblio<strong>Tech</strong></span></a>
    <div class="nav-links">
      <a th:href="@{/livros}" class="nav-item ">Livros</a>
      <a th:href="@{/autores}" class="nav-item ">Autores</a>
      <a th:href="@{/categorias}" class="nav-item active">Categorias</a>
      <a th:href="@{/usuarios}" class="nav-item ">Usuários</a>
      <a th:href="@{/emprestimos}" class="nav-item ">Empréstimos</a>
    </div>
  </div>
</nav>
<main class="container">
  <div th:if="${mensagem}" class="notice notice-success" th:text="${mensagem}"></div>
  <div th:if="${erro}" class="notice notice-error" th:text="${erro}"></div>

  <header class="page-header"><div><h1 th:text="${categoria.id == null ? 'Cadastrar Categoria' : 'Editar Categoria'}">Categoria</h1><p class="subtitle">Informe o nome e a descrição da categoria</p></div><a th:href="@{/categorias}" class="btn btn-secondary">Voltar para Lista</a></header>
  <div class="card form-card"><form th:action="@{/categorias/salvar}" th:object="${categoria}" method="post">
    <input type="hidden" th:field="*{id}">
    <div class="form-group"><label for="nome">Nome</label><input id="nome" type="text" th:field="*{nome}" placeholder="Ex.: Ficção" maxlength="120" required></div>
    <div class="form-group"><label for="descricao">Descrição</label><input id="descricao" type="text" th:field="*{descricao}" placeholder="Descreva a categoria" maxlength="255"></div>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Salvar Categoria</button><a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a></div>
  </form></div>

</main>
</body>
</html>
