<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioTech — Categorias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/crud-additions.css}">
</head>
<body>
<nav class="navbar">
  <div class="nav-container">
    <a th:href="@{/livros}" class="brand"><span class="brand-icon">📚</span><span>Biblio<strong>Tech</strong></span></a>
    <div class="nav-links">
      <a th:href="@{/livros}" class="nav-item ">Livros</a>
      <a th:href="@{/autores}" class="nav-item ">Autores</a>
      <a th:href="@{/categorias}" class="nav-item active">Categorias</a>
      <a th:href="@{/usuarios}" class="nav-item ">Usuários</a>
      <a th:href="@{/emprestimos}" class="nav-item ">Empréstimos</a>
    </div>
  </div>
</nav>
<main class="container">
  <div th:if="${mensagem}" class="notice notice-success" th:text="${mensagem}"></div>
  <div th:if="${erro}" class="notice notice-error" th:text="${erro}"></div>

  <header class="page-header"><div><h1>Categorias</h1><p class="subtitle">Organize os livros por assunto ou gênero</p></div><a th:href="@{/categorias/novo}" class="btn btn-primary">+ Nova Categoria</a></header>
  <section class="stats-grid"><div class="stat-card"><span class="stat-label">Total de Categorias</span><strong class="stat-value" th:text="${#lists.size(categorias)}">0</strong></div></section>
  <div class="card"><table>
    <thead><tr><th>ID</th><th>Nome</th><th>Descrição</th><th class="text-right">Ações</th></tr></thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(categorias)}"><td colspan="4" class="empty-state">Nenhuma categoria cadastrada.</td></tr>
    <tr th:each="categoria : ${categorias}">
      <td class="id-col" th:text="|#${categoria.id}|">#1</td><td class="fw-600" th:text="${categoria.nome}">Literatura</td><td th:text="${categoria.descricao}">Descrição</td>
      <td><div class="actions"><a th:href="@{/categorias/editar/{id}(id=${categoria.id})}" class="btn btn-sm btn-edit">Editar</a><form th:action="@{/categorias/excluir/{id}(id=${categoria.id})}" method="post" onsubmit="return confirm('Deseja excluir esta categoria?');"><button class="btn btn-sm btn-delete" type="submit">Excluir</button></form></div></td>
    </tr>
    </tbody>
  </table></div>

</main>
</body>
</html>
