<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioTech — Cadastro de Usuário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/crud-additions.css}">
</head>
<body>
<nav class="navbar">
  <div class="nav-container">
    <a th:href="@{/livros}" class="brand"><span class="brand-icon">📚</span><span>Biblio<strong>Tech</strong></span></a>
    <div class="nav-links">
      <a th:href="@{/livros}" class="nav-item ">Livros</a>
      <a th:href="@{/autores}" class="nav-item ">Autores</a>
      <a th:href="@{/categorias}" class="nav-item ">Categorias</a>
      <a th:href="@{/usuarios}" class="nav-item active">Usuários</a>
      <a th:href="@{/emprestimos}" class="nav-item ">Empréstimos</a>
    </div>
  </div>
</nav>
<main class="container">
  <div th:if="${mensagem}" class="notice notice-success" th:text="${mensagem}"></div>
  <div th:if="${erro}" class="notice notice-error" th:text="${erro}"></div>

  <header class="page-header"><div><h1 th:text="${usuario.id == null ? 'Cadastrar Usuário' : 'Editar Usuário'}">Usuário</h1><p class="subtitle">Informe os dados do usuário da biblioteca</p></div><a th:href="@{/usuarios}" class="btn btn-secondary">Voltar para Lista</a></header>
  <div class="card form-card"><form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
    <input type="hidden" th:field="*{id}">
    <div class="form-group"><label for="nome">Nome completo</label><input id="nome" type="text" th:field="*{nome}" placeholder="Nome do usuário" maxlength="150" required></div>
    <div class="form-group"><label for="email">E-mail</label><input id="email" type="email" th:field="*{email}" placeholder="usuario@exemplo.com" maxlength="150" required></div>
    <div class="form-group"><label for="matricula">Matrícula</label><input id="matricula" type="text" th:field="*{matricula}" placeholder="Número de matrícula" maxlength="50" required></div>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Salvar Usuário</button><a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a></div>
  </form></div>

</main>
</body>
</html>
